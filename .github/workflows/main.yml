name: Build GlobalPulse APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER_BIN="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER_BIN" --licenses || true
          "$SDKMANAGER_BIN" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlobalPulse-v1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
